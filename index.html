<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Asistente hidropónico local-first para cultivos DWC."
    />
    <meta property="og:title" content="Raíz — Asistente hidropónico" />
    <meta
      property="og:description"
      content="Gestioná tu cultivo DWC, localmente y sin cuenta."
    />
    <meta property="og:image" content="public/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="public/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("raiz-theme") ||
          (matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
      } catch (e) {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: light)",
        ).matches
          ? "light"
          : "dark";
      }
    </script>
    <title>Raíz — Asistente hidropónico</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Ir al contenido</a>
    <header class="topbar">
      <a class="brand" href="#inicio" aria-label="Raíz, inicio"
        ><span aria-hidden="true">◒</span><b>Raíz</b
        ><small>Asistente hidropónico</small></a
      >
      <nav aria-label="Navegación principal">
        <button data-view="panel" class="active">Panel</button
        ><button data-view="historial">Historial</button
        ><button data-view="inventario">Inventario</button
        ><button data-view="configuracion">Configuración</button>
      </nav>
      <div class="top-actions">
        <button id="theme-toggle" class="icon-button" aria-label="Cambiar tema">
          ◐</button
        ><button id="export-button" class="secondary">Exportar</button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <section id="welcome" class="welcome" hidden>
        <div>
          <p class="eyebrow">Cultivo local-first</p>
          <h1>Tu cultivo, <em>con contexto.</em></h1>
          <p>
            Seguimiento independiente por DWC, tareas claras y datos que
            permanecen en tu dispositivo.
          </p>
          <div class="actions">
            <button id="start-example" class="primary">
              Abrir ejemplo Eyeballz</button
            ><button id="download-template" class="secondary">
              Descargar plantilla</button
            ><label class="secondary file-button"
              >Importar archivo<input
                id="welcome-import"
                type="file"
                accept="application/json"
            /></label>
          </div>
        </div>
        <aside class="welcome-card">
          <small>Semana 0 · Cultivo en curso</small>
          <h2>Enraizado</h2>
          <p>Eyeballz · 4 DWC independientes</p>
          <div class="metric-row">
            <span>24 °C</span><span>72 %</span><span>18/6</span>
          </div>
        </aside>
      </section>
      <section id="app" hidden>
        <div class="page-heading">
          <div>
            <p class="eyebrow" id="week-label">Semana 0</p>
            <h1 id="cultivation-title">Cultivo</h1>
            <p id="cultivation-subtitle"></p>
          </div>
          <div class="actions">
            <button id="notification-button" class="secondary">
              Activar avisos</button
            ><button id="new-measurement" class="primary">+ Medición</button>
          </div>
        </div>
        <section id="panel-view" class="view"></section>
        <section id="history-view" class="view" hidden></section>
        <section id="inventory-view" class="view" hidden></section>
        <section id="settings-view" class="view" hidden></section>
      </section>
    </main>
    <dialog id="modal">
      <form id="modal-form" method="dialog">
        <header>
          <h2 id="modal-title"></h2>
          <button value="cancel" class="icon-button" aria-label="Cerrar">
            ×
          </button>
        </header>
        <div id="modal-body"></div>
        <footer>
          <button value="cancel" class="secondary">Cancelar</button
          ><button id="modal-submit" value="default" class="primary">
            Guardar
          </button>
        </footer>
      </form>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input id="import-file" type="file" accept="application/json" hidden />
    <script type="module" src="js/app.js"></script>
  </body>
</html>
